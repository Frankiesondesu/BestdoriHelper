name: 构建安装包

# 一次跑出两个平台的产物，并（打 tag 时）自动发 Release。
#
# 为什么不做 paths 过滤：`on.push.paths` 对 tag 推送同样生效 —— 打 tag 时如果
# 对应的提交没改到那些路径，工作流就不会触发，Release 永远发不出来。
# 这个坑很难察觉（没有报错）。所以这里不做过滤，代价只是每次 push 多跑几分钟，
# 公开仓库的 Actions 额度是无限的。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 时要创建 Release

jobs:
  # ------------------------------------------------------------------
  # 安卓 APK（Capacitor 壳）
  # ------------------------------------------------------------------
  android:
    name: 安卓 APK
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu runner **预装了** Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 不需要再装。实测加 android-actions/setup-android@v3 这一步反而会失败
      # （它可能再去下一遍 SDK），所以这里只确认一下环境。
      - name: 确认 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "（无 platforms）"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "（无 build-tools）"

      - name: 装 npm 依赖
        run: npm ci --no-audit --no-fund

      - name: 生成安卓工程
        run: |
          # android/ 是生成物、没入库（230 MB），首次在这里现生成
          if [ ! -d android ]; then
            echo "android/ 不存在，用 Capacitor 生成"
            npx cap add android
          else
            echo "android/ 已存在，跳过"
          fi

      - name: 同步网页资源进安卓工程
        run: npx cap sync android

      - name: 构建 debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Windows 桌面版（PyInstaller）
  # ------------------------------------------------------------------
  windows:
    name: Windows 桌面版
    runs-on: windows-latest
    env:
      # 兜底：runner 控制台默认 cp1252，子进程（含 PyInstaller）打印中文会崩
      PYTHONIOENCODING: utf-8
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          # 与本机验证通过的版本保持一致（本机 3.13）。用 3.12 时 PyInstaller
          # 那步失败过一次 —— 依赖 wheel 的可用版本不同，会对 hook 有影响。
          python-version: '3.13'

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包（onedir + zip）
        run: python scripts/build_win.py

      # Windows runner 的默认 shell 是 pwsh —— 这里必须写 PowerShell 语法。
      # （第一次写成 cmd 的 `dir /s /b` + PowerShell 的 `2>$null` 混用，
      #   结果诊断步骤自己也失败了，等于白加。）
      - name: 打包失败时打印诊断
        if: failure()
        shell: pwsh
        run: |
          Write-Output "---- Python 版本 ----"
          python -V
          Write-Output "---- 依赖版本 ----"
          python -c "import PySide6, cv2, numpy, PIL; print('PySide6', PySide6.__version__); print('cv2', cv2.__version__); print('numpy', numpy.__version__); print('PIL', PIL.__version__)"
          Write-Output "---- dist 下的内容 ----"
          Get-ChildItem -Path dist -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object -First 40 -ExpandProperty FullName

      - name: 上传 Windows 包
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/BestdoriHelper-win.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 打 tag 时把两个产物挂到 Release
  # ------------------------------------------------------------------
  release:
    name: 发布 Release
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 取回两个产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 Release 并挂产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/*.apk
            artifacts/windows-app/*.zip
          generate_release_notes: true
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | 安卓 | `app-debug.apk` | 传到手机安装（需允许「安装未知来源」）。同步 Bestdori 只在 App 里可用 |
            | Windows | `BestdoriHelper-win.zip` | 解压后双击 `BestdoriHelper.exe` |

            网页版（无需安装）：见仓库的 GitHub Pages 地址。
