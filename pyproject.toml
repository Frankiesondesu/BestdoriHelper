[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bestdori-helper"
version = "0.1.0"
description = "BanG Dream! 少女乐团派对 — 卡面截图批量识别 + Bestdori 卡册同步工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.3",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 桌面界面（bdh gui / run-gui.bat）
gui = ["PySide6>=6.6"]
# 文字辅助识别（可选，不装也能用）
ocr = ["rapidocr-onnxruntime>=1.3"]
# 几何校验：真实截图 top-1 准确率 67.9% -> 100%，强烈建议装
sift = ["opencv-python>=4.8"]
# 装齐所有可选能力
all = ["PySide6>=6.6", "opencv-python>=4.8", "rapidocr-onnxruntime>=1.3",
       "playwright>=1.44"]
# 浏览器自动化写入 Bestdori 卡册
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
bdh = "bestdori_helper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bestdori_helper.web" = ["static/*"]
